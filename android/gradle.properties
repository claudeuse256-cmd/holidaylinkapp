// Kotlin and Java both target 17 (see app/build.gradle.kts jvmToolchain(17)).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx768m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Backend address the app talks to.
// 127.0.0.1 is correct when the Node server runs in Termux on the SAME physical phone.
// Use 10.0.2.2 for the Android emulator, or http://<phone-lan-ip>:8080 for a real device.
# Production builds must use https://.
HL_API_BASE_URL=https://holidaylink-server.onrender.com

# TURN relay for calls. STUN alone cannot cross carrier-grade NAT, so a call can be
# "accepted" on both phones and still carry no audio or video. Metered free TURN:
HL_TURN_HOST=global.relay.metered.ca
HL_TURN_USERNAME=df860ef787d7f7ddfe8e51b1
HL_TURN_PASSWORD=yjUPbIvuwWLR72Je
