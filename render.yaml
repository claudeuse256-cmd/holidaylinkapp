services:
  - type: web
    name: holidaylink-otp
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: DEFAULT_COUNTRY_CODE
        value: "256"
      - key: OTP_COOLDOWN_SECONDS
        value: "45"
      - key: YOOLA_API_KEY
        sync: false
      - key: YOOLA_SENDER
        sync: false
