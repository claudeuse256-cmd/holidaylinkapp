name: Build HolidayLink APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=""
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          else
            echo "sdkmanager not found"
            find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Resolve production API URL
        run: |
          if [ -n "${{ secrets.HL_API_BASE_URL }}" ]; then
            API_URL="${{ secrets.HL_API_BASE_URL }}"
          else
            API_URL="https://holidaylink-server.onrender.com"
          fi
          echo "HL_API_BASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "Building Android app with API URL: $API_URL"

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon -PHL_API_BASE_URL="$HL_API_BASE_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HolidayLink-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
