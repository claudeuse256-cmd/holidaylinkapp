
name: Build HolidayLink APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=""
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          else
            echo "sdkmanager not found"
            find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Set unique version
        run: |
          CODE=$((10000 + GITHUB_RUN_NUMBER))
          NAME="2.4.7+build.${GITHUB_RUN_NUMBER}"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Building HolidayLink $NAME ($CODE)"

      - name: Restore signing keystore
        run: |
          if [ -n "${{ secrets.HL_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.HL_KEYSTORE_BASE64 }}" | base64 -d > android/holidaylink.jks
            echo "HAS_RELEASE_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "::warning::HL_KEYSTORE_BASE64 is not set; signing with a throw-away debug key. Play Protect and update installs work best with ONE permanent key - see README."
            echo "HAS_RELEASE_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Resolve production API URL
        run: |
          if [ -n "${{ secrets.HL_API_BASE_URL }}" ]; then
            API_URL="${{ secrets.HL_API_BASE_URL }}"
          else
            API_URL="https://holidaylink-server.onrender.com"
          fi
          echo "HL_API_BASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "Building with API URL: $API_URL"

      - name: Build APK
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon "-PHL_API_BASE_URL=${HL_API_BASE_URL}" "-PHL_VERSION_CODE=${VERSION_CODE}" "-PHL_VERSION_NAME=${VERSION_NAME}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HolidayLink-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Name release APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/HolidayLink-${VERSION_NAME}.apk"

      - name: Publish latest Actions APK as a GitHub Release asset
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.VERSION_CODE }}
          name: ${{ env.VERSION_NAME }}
          body_path: UPDATE_NOTES.md
          files: android/app/build/outputs/apk/release/HolidayLink-${{ env.VERSION_NAME }}.apk
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
